<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Favoritos | Servicios 365</title>

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
      font-family:Arial, sans-serif;
    }

    body{
      background:#f5f7fb;
      color:#172033;
    }

    .top{
      background:white;
      padding:18px 20px;
      display:flex;
      align-items:center;
      gap:15px;
      box-shadow:0 2px 10px rgba(0,0,0,.08);
    }

    .volver{
      text-decoration:none;
      font-size:26px;
      color:#0b3d91;
    }

    .top h1{
      font-size:22px;
      color:#0b3d91;
    }

    .container{
      max-width:700px;
      margin:auto;
      padding:25px 18px 100px;
    }

    .titulo{
      margin-bottom:20px;
    }

    .titulo h2{
      font-size:27px;
      color:#0b3d91;
    }

    .titulo p{
      margin-top:6px;
      color:#64748b;
    }

    .favorito{
      background:white;
      padding:16px;
      border-radius:16px;
      margin-bottom:14px;
      box-shadow:0 4px 15px rgba(0,0,0,.06);
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .favorito h3{
      margin-bottom:5px;
    }

    .favorito small{
      color:#64748b;
    }

    .eliminar{
      border:none;
      background:#fff0f0;
      color:#d00;
      width:42px;
      height:42px;
      border-radius:50%;
      font-size:20px;
      cursor:pointer;
    }

    .vacio{
      background:white;
      border-radius:18px;
      padding:45px 25px;
      text-align:center;
      box-shadow:0 4px 15px rgba(0,0,0,.06);
    }

    .vacio .corazon{
      font-size:55px;
      margin-bottom:15px;
    }

    .vacio h3{
      margin-bottom:8px;
      color:#0b3d91;
    }

    .vacio p{
      color:#64748b;
      line-height:1.5;
    }

    .buscar{
      display:inline-block;
      margin-top:20px;
      padding:13px 22px;
      background:#0878f9;
      color:white;
      text-decoration:none;
      border-radius:12px;
      font-weight:bold;
    }
  </style>
</head>

<body>

  <header class="top">
    <a href="index.html" class="volver">←</a>
    <h1>Servicios 365</h1>
  </header>

  <main class="container">

    <div class="titulo">
      <h2>❤️ Mis favoritos</h2>
      <p>Guardá técnicos y comercios para encontrarlos rápidamente.</p>
    </div>

    <div id="listaFavoritos"></div>

  </main>

  <script>
    const contenedor = document.getElementById("listaFavoritos");

    let favoritos = JSON.parse(localStorage.getItem("favoritos365")) || [];

    function mostrarFavoritos(){

      contenedor.innerHTML = "";

      if(favoritos.length === 0){

        contenedor.innerHTML = `
          <div class="vacio">
            <div class="corazon">❤️</div>

            <h3>Todavía no tenés favoritos</h3>

            <p>
              Cuando encuentres un técnico o comercio que te interese,
              guardalo acá para volver a contactarlo fácilmente.
            </p>

            <a href="index.html" class="buscar">
              Buscar en Servicios 365
            </a>
          </div>
        `;

        return;
      }

      favoritos.forEach((item, index) => {

        const tarjeta = document.createElement("div");
        tarjeta.className = "favorito";

        tarjeta.innerHTML = `
          <div>
            <h3>${item.nombre}</h3>
            <small>${item.tipo || "Servicios 365"}</small>
          </div>

          <button class="eliminar"
            onclick="eliminarFavorito(${index})">
            ❤️
          </button>
        `;

        contenedor.appendChild(tarjeta);
      });
    }

    function eliminarFavorito(index){

      favoritos.splice(index,1);

      localStorage.setItem(
        "favoritos365",
        JSON.stringify(favoritos)
      );

      mostrarFavoritos();
    }

    mostrarFavoritos();
  </script>

</body>
</html>
