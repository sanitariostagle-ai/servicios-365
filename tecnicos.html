<title>Buscar técnicos | Servicios 365</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>

const SUPABASE_URL =
"https://frbnlqihbxnesdbmduia.supabase.co";

const SUPABASE_KEY =
"sb_publishable_iSyhMVlbPHgIiDhkaz2zuA_B9oEzfvz";

const clienteSupabase =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

let tecnicos = [];


async function cargarTecnicos(){

    const contenedor =
        document.getElementById("resultados");

    contenedor.innerHTML = `
        <div class="vacio">
            <div class="icono">⏳</div>
            <h3>Cargando técnicos...</h3>
        </div>
    `;

    const { data, error } =
        await clienteSupabase
        .from("tecnicos")
        .select("*")
        .eq("activo", true)
        .order("nombre", {
            ascending:true
        });

    if(error){

        console.error(error);

        contenedor.innerHTML = `
            <div class="vacio">
                <div class="icono">⚠️</div>
                <h3>No pudimos cargar los técnicos</h3>
                <p>Intentá nuevamente en unos instantes.</p>
            </div>
        `;

        return;
    }

    tecnicos = data || [];

    mostrarTecnicos(tecnicos);
}


function mostrarTecnicos(lista){

    const contenedor =
        document.getElementById("resultados");

    contenedor.innerHTML = "";

    if(lista.length === 0){

        contenedor.innerHTML = `
        <div class="vacio">

            <div class="icono">🔧</div>

            <h3>No encontramos técnicos</h3>

            <p>
            Probá cambiando la especialidad
            o la zona seleccionada.
            </p>

        </div>
        `;

        return;
    }


    lista.forEach(tecnico => {

        const descripcion =
            tecnico.descripcion || "Servicio técnico";

        const matricula =
            tecnico.matricula
            ? `<br>📋 Matrícula: ${tecnico.matricula}`
            : "";

        const whatsapp =
            String(tecnico.whatsapp || "")
            .replace(/\D/g,"");

        const telefono =
            String(tecnico.telefono || "")
            .replace(/\D/g,"");


        contenedor.innerHTML += `

        <article class="tecnico">

            <div class="tecnico-superior">

                <div class="avatar">🔧</div>

                <div>
                    <h3>${tecnico.nombre || ""}</h3>

                    <div class="especialidad">
                        ${tecnico.especialidad || ""}
                    </div>
                </div>

            </div>


            <div class="datos">

                📍 ${tecnico.zona || ""}<br>

                🛠 ${descripcion}

                ${matricula}

            </div>


            <div class="acciones">

                <a
                class="whatsapp"
                href="https://wa.me/${whatsapp}?text=Hola%2C%20te%20contacto%20desde%20Servicios%20365"
                target="_blank">
                WhatsApp
                </a>

                <a
                class="llamar"
                href="tel:${telefono}">
                Llamar
                </a>

            </div>

        </article>

        `;

    });

}


function normalizar(texto){

    return String(texto || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"")
        .toLowerCase()
        .trim();
}


function buscarTecnicos(){

    const especialidad =
        normalizar(
            document.getElementById("especialidad").value
        );

    const zona =
        normalizar(
            document.getElementById("zona").value
        );

    const texto =
        normalizar(
            document.getElementById("texto").value
        );


    const filtrados = tecnicos.filter(t => {

        const coincideEspecialidad =
            !especialidad ||
            normalizar(t.especialidad) === especialidad;

        const coincideZona =
            !zona ||
            normalizar(t.zona).includes(zona);

        const coincideTexto =
            !texto ||
            normalizar(t.nombre).includes(texto) ||
            normalizar(t.descripcion).includes(texto) ||
            normalizar(t.especialidad).includes(texto);

        return (
            coincideEspecialidad &&
            coincideZona &&
            coincideTexto
        );

    });


    mostrarTecnicos(filtrados);
}


cargarTecnicos();

</script>

<script>

/*
Acá vamos a cargar los técnicos desde el
Panel Administrativo de Servicios 365.
*/

const tecnicos = [];

function mostrarTecnicos(lista){

    const contenedor =
    document.getElementById("resultados");

    contenedor.innerHTML = "";

    if(lista.length === 0){

        contenedor.innerHTML = `
        <div class="vacio">

            <div class="icono">🔧</div>

            <h3>Estamos incorporando técnicos</h3>

            <p>
            Próximamente vas a poder encontrar profesionales
            verificados por especialidad y zona.
            </p>

        </div>
        `;

        return;
    }

    lista.forEach(tecnico => {

        contenedor.innerHTML += `

        <article class="tecnico">

            <div class="tecnico-superior">

                <div class="avatar">🔧</div>

                <div>
                    <h3>${tecnico.nombre}</h3>
                    <div class="especialidad">
                        ${tecnico.especialidad}
                    </div>
                </div>

            </div>

            <div class="datos">

                📍 ${tecnico.zona}<br>
                🛠 ${tecnico.descripcion}

            </div>

            <div class="acciones">

                <a
                class="whatsapp"
                href="https://wa.me/${tecnico.whatsapp}"
                target="_blank">
                WhatsApp
                </a>

                <a
                class="llamar"
                href="tel:${tecnico.telefono}">
                Llamar
                </a>

            </div>

        </article>

        `;

    });

}

function buscarTecnicos(){

    const especialidad =
    document.getElementById("especialidad").value.toLowerCase();

    const zona =
    document.getElementById("zona").value.toLowerCase();

    const texto =
    document.getElementById("texto").value.toLowerCase();

    const filtrados = tecnicos.filter(t => {

        const coincideEspecialidad =
        !especialidad ||
        t.especialidad.toLowerCase() === especialidad;

        const coincideZona =
        !zona ||
        t.zona.toLowerCase().includes(zona);

        const coincideTexto =
        !texto ||
        t.nombre.toLowerCase().includes(texto) ||
        t.descripcion.toLowerCase().includes(texto);

        return
        coincideEspecialidad &&
        coincideZona &&
        coincideTexto;

    });

    mostrarTecnicos(filtrados);

}

mostrarTecnicos(tecnicos);
